<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolleyBoard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: fixed royal-blue sidebar + scrolling dashboard column; one committed dark look (brand is royal blue + coral). */
:root{
  --ground:#0A0D4A; --royal:#2128D0; --ink:#0B0F63; --text:#FFFFFF; --muted:rgba(255,255,255,.82);
  --coral:#F0705A; --amber:#FFB347; --focus:#FFD23F;
  --ok:#4ADE80; --bad:#FF6B6B; --warn:#FFD23F; --info:#7DD3FC;
  --card:linear-gradient(155deg,#1B22A8 0%,#2A1B9C 55%,#3E1880 100%);
  --line:rgba(255,255,255,.2);
  --display:'Kanit',system-ui,sans-serif; --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.app{display:flex;flex-wrap:wrap;min-height:100vh;background:radial-gradient(900px 520px at 90% -5%,rgba(201,68,31,.45),transparent 60%),radial-gradient(800px 640px at 0% 100%,rgba(106,31,207,.55),transparent 60%),var(--ground)}
.side{flex:0 0 248px;background:var(--royal);padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side img.logo{width:100%;max-width:170px;display:block;margin:0 auto;height:auto}
.menu{display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;color:#fff;text-decoration:none;font-weight:500}
.nav:hover{background:rgba(255,255,255,.16)}
.nav[aria-current]{background:#fff;color:#1A20B8;font-weight:600}
.who{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.12)}
.who-row{display:flex;align-items:center;gap:12px}
.avatar{flex:0 0 40px;height:40px;border-radius:50%;background:var(--coral);color:var(--ink);font-family:var(--display);font-weight:600;display:flex;align-items:center;justify-content:center}
.who small{display:block;font-size:13px;opacity:.9}
.who label{font-size:13px;font-weight:600}
select,.txt,textarea,input.num{min-height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.4);background:rgba(0,0,0,.22);color:#fff;padding:0 12px;width:100%}
select option{color:#0B0F63}
textarea{min-height:84px;padding:10px 12px;line-height:1.5;resize:vertical}
input.num{width:76px;text-align:center;padding:0 6px}
::placeholder{color:rgba(255,255,255,.65)}
main{flex:1 1 560px;min-width:0;padding:28px 32px 48px;padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;outline:none}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:28px 32px;border-radius:24px;background:linear-gradient(100deg,#2128D0 0%,#5B1FCB 45%,#C9441F 100%);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hero svg{position:absolute;right:0;top:0;width:65%;height:100%;z-index:-1;opacity:.4}
h1{margin:0;font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(30px,5vw,50px);line-height:1.15;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:700;font-style:italic;font-size:20px;line-height:1.3}
h3{margin:8px 0 0;font-size:16px;font-weight:600}
.hero p{margin:6px 0 0;font-size:17px}
.card{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:14px}
.btn.main{background:linear-gradient(90deg,#FF7A59,#FFB347);border-color:transparent;color:var(--ink);font-style:italic;font-family:var(--display);font-size:17px}
.btn.main:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(90deg,#FF7A59,#FFB347)}
.tab{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
.tab:hover:not(:disabled){background:rgba(255,255,255,.14)}
.tab:disabled{opacity:.5;cursor:not-allowed}
.tab[aria-pressed="true"]{background:#fff;color:#1A20B8;border-color:#fff;font-weight:600}
.icon{width:44px;height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon:hover:not(:disabled){background:rgba(255,255,255,.14)}
.icon:disabled{opacity:.35;cursor:not-allowed}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.hint{min-height:48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.22);font-size:15px;line-height:1.45}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:13px;padding:10px 12px;color:rgba(255,255,255,.88);border-bottom:1.5px solid rgba(255,255,255,.25);white-space:nowrap}
td{padding:4px 12px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap}
.rowbtn{background:none;border:0;color:#fff;font-weight:600;cursor:pointer;text-align:left;padding:10px 0;min-height:44px;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:4px}
.rowbtn:hover{text-decoration-color:#fff}
/* court */
.court{position:relative;width:100%;max-width:660px;margin:0 auto;aspect-ratio:1/1;background:linear-gradient(160deg,#141A9A,#3A1690);border-radius:18px;overflow:hidden}
.net{position:absolute;left:4%;right:4%;top:calc(9% - 6px);height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,#fff 0 3px,#C9CCF5 3px 8px);z-index:3}
.lbl{position:absolute;font-size:12px;color:rgba(255,255,255,.9)}
.floor{position:absolute;left:7%;right:7%;top:9%;bottom:6%;background:linear-gradient(180deg,#3944EE 0%,#5A2FD8 70%,#7A2CC0 100%);border:3px solid #fff}
.ghost{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,72px);line-height:1;color:rgba(255,255,255,.1);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:92px;padding:0;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:2;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1)}
.tok:disabled{cursor:default}
.disc{position:relative;display:block;width:60px;height:60px}
.disc>.n{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:24px}
.zone{position:absolute;right:-8px;top:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);border:2px solid #fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.warnmark{position:absolute;left:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:var(--warn);border:2px solid var(--ink);color:var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.tname{padding:2px 10px;border-radius:999px;background:rgba(7,10,60,.85);font-size:13px;font-weight:500;line-height:1.4;white-space:nowrap}
.bench{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;text-align:left;cursor:pointer}
.bench:hover:not(:disabled){background:rgba(255,255,255,.14)}
.bench[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.bench:disabled{cursor:not-allowed;opacity:.62}
.num-badge{flex:0 0 40px;height:40px;border-radius:50%;background:var(--coral);color:var(--ink);font-family:var(--display);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:13px;color:rgba(255,255,255,.85)}
.day{min-height:56px;border-radius:10px;border:1.5px solid transparent;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.day:hover{background:rgba(255,255,255,.14)}
.day[aria-pressed="true"]{background:#fff;color:#1A20B8;font-weight:600}
.day i{width:7px;height:7px;border-radius:50%;display:block}
.score{flex:1;padding:14px;border-radius:16px;text-align:center}
.score b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,72px);line-height:1.1}
/* attendance */
fieldset{margin:0;padding:6px 10px;border:1px solid rgba(255,255,255,.14);border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:rgba(255,255,255,.04)}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opt{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);font-size:14px;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.12)}
.opt input{accent-color:var(--coral);width:18px;height:18px;margin:0}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px}
.wkday{padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:4px;min-height:92px;border:1.5px solid transparent;text-align:left;color:#fff;font-size:14px}
button.wkday{cursor:pointer}
button.wkday:hover{background:rgba(255,255,255,.2)}
.dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl div{padding:12px;border-radius:12px;background:rgba(255,255,255,.08)}
.dl dt{font-size:13px;color:var(--muted)}
.dl dd{margin:2px 0 0;font-weight:600}
.perm{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.perm.full{background:#fff;color:var(--ink)}
.perm.view{background:rgba(255,255,255,.16)}
.perm.none{border:1.5px dashed rgba(255,255,255,.6)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;background:#1B22A8;background-image:var(--card);color:#fff;padding:22px;width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
dialog::backdrop{background:rgba(5,7,40,.7)}
dialog form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{margin:0;padding:8px 12px;border-radius:10px;background:var(--warn);color:var(--ink);font-weight:600;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pad-ok{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#fff;color:var(--ink);font-weight:600}
@media (max-width:900px){
  .side{flex:1 1 100%;position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .side img.logo{width:56px;margin:0}
  .menu{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;padding-bottom:4px}
  .nav{white-space:nowrap;min-height:44px;padding:0 12px}
  .who{margin:0 0 0 auto;flex-direction:row;align-items:center;padding:8px 10px;order:2}
  .who label.sr+select{width:150px}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .hero{padding:22px 20px}
}
@media (max-width:620px){
  .tok{width:66px}.disc,.disc>.n{width:44px;height:44px}.disc>.n{font-size:18px}
  .zone{min-width:22px;height:22px;font-size:11px;right:-8px;top:-8px}.warnmark{width:22px;height:22px;font-size:12px}
  .tname{font-size:11px;padding:1px 6px}
  .lbl{font-size:10px}.fgrid{grid-template-columns:1fr}.card{padding:14px}
}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
</style>

</head>
<body>

<div class="app">
  <aside class="side">
    <img class="logo" src="logo.png" alt="VolleyBoard">
    <nav class="menu" aria-label="เมนูหลัก" id="menu"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
(function(){
'use strict';
var KEY='volleyboard-v1';
var POS_TH={S:'เซตเตอร์',OH:'เอาต์ไซด์ฮิตเตอร์',MB:'มิดเดิลบล็อกเกอร์',OP:'ออปโพสิต',L:'ลิเบอโร'};
var ST_TH={active:'พร้อมลงสนาม',injured:'บาดเจ็บ',unavailable:'ติดภารกิจ / ลา'};
var ST_SHORT={active:'พร้อม',injured:'บาดเจ็บ',unavailable:'ติดภารกิจ'};
var ST_COL={active:'#4ADE80',injured:'#FF6B6B',unavailable:'#FFD23F'};
var ZONES=[4,3,2,5,6,1];
var NEXT={4:3,3:2,2:1,1:6,6:5,5:4};
var PREV={3:4,2:3,1:2,6:1,5:6,4:5};
var FORMS={
  base:{label:'ตำแหน่งฐาน',pts:{4:[17,19],3:[50,19],2:[83,19],5:[17,74],6:[50,74],1:[83,74]}},
  receive:{label:'รับเสิร์ฟ',pts:{4:[10,28],3:[50,16],2:[92,24],5:[22,60],6:[50,76],1:[78,60]}},
  block:{label:'บล็อก',pts:{4:[20,10],3:[50,10],2:[80,10],5:[17,66],6:[50,80],1:[83,66]}},
  fault:{label:'ตัวอย่างผิดกติกา',pts:{4:[15,20],3:[50,56],2:[85,20],5:[18,76],6:[50,40],1:[82,70]}}
};
var ROLES={
  headcoach:{s:'HC',l:'Head Coach',note:'แก้ไขได้ทุกอย่าง'},
  assistant:{s:'AC',l:'Assistant Coach',note:'ดูข้อมูล · บันทึกสถิติ'},
  player:{s:'PL',l:'ผู้เล่น',note:'ดูอย่างเดียว'}
};
var NAV=[
  ['court','กระดานสนาม','<rect x="3" y="4" width="18" height="16" rx="1.5"></rect><path d="M3 9h18M12 9v11"></path>'],
  ['roster','ผู้เล่น','<circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5.2a3.2 3.2 0 010 5.6M18 14.2c1.8.8 3 2.6 3 5.8"></path>'],
  ['matches','แมตช์','<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>'],
  ['training','ฝึกซ้อม','<rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9zM9 12l2 2 4-4"></path>'],
  ['roles','สิทธิ์ผู้ใช้','<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path>']
];
var TH_MONTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_MON_S=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var TH_DAY=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
var WEEK_PATTERN=[ // Monday first
  {t:'17:30–19:30',p:'[สถานที่ซ้อม]'},{t:'พัก',p:''},{t:'17:30–19:30',p:'[สถานที่ซ้อม]'},{t:'พัก',p:''},
  {t:'17:30–19:30',p:'[สถานที่ซ้อม]'},{t:'15:00–17:00',p:'เกมอุ่นเครื่อง'},{t:'พัก',p:''}];
var ATT=[['p','มา','#4ADE80'],['l','สาย','#FFD23F'],['a','ขาด','#FF6B6B'],['e','ลา','#7DD3FC']];

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseIso(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var TODAY_ISO=iso(TODAY);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dateLabel(s){var d=parseIso(s);return d.getDate()+' '+TH_MON_S[d.getMonth()]+' '+(d.getFullYear()+543)}

function seedPlayers(){
  function P(id,n,nick,full,pos,pos2,h,w,sp,bl,grp,st){return {id:id,n:n,nick:nick,full:full,pos:pos,pos2:pos2,h:h,w:w,spike:sp,block:bl,grp:grp,st:st||'active',phone:''}}
  return [
    P('p1',2,'มะลิ','มะลิวัลย์ สุขใจ','S','OP',176,64,296,285,'ตัวจริง'),
    P('p3',7,'ปลา','ปลาทอง ใจดี','OH','OP',178,66,301,291,'ตัวจริง'),
    P('p4',5,'แพร','แพรวา ศรีสุข','MB','OP',183,70,305,296,'ตัวจริง'),
    P('p6',11,'นิ่ม','นิ่มนวล รุ่งเรือง','OP','OH',181,68,308,298,'ตัวจริง'),
    P('p2',10,'ฟ้า','ฟ้าใส มั่นคง','OH','L',175,62,298,287,'ตัวจริง'),
    P('p5',14,'เจน','เจนจิรา แสงทอง','MB','OH',184,71,304,297,'ตัวจริง'),
    P('p7',15,'พลอย','พลอยไพลิน ทองดี','S','OH',174,61,292,282,'สำรอง'),
    P('p8',12,'อ้อม','อ้อมใจ พึ่งพา','OH','MB',177,65,299,289,'สำรอง','unavailable'),
    P('p9',9,'ขวัญ','ขวัญใจ เจริญพร','MB','OP',182,69,303,294,'สำรอง'),
    P('p10',8,'ก้อย','ก้อยกมล ดีงาม','OP','OH',180,67,306,296,'สำรอง','injured'),
    P('p11',1,'ใบเตย','ใบเตย หอมหวน','L','OH',168,58,270,262,'สำรอง'),
    P('p12',3,'มุก','มุกดา สดใส','L','S',166,57,268,260,'สำรอง')
  ];
}
function defaults(){
  var y=TODAY.getFullYear(),m=TODAY.getMonth();
  function ev(id,type,day,title,time){return {id:id,type:type,title:title,date:iso(new Date(y,m,day)),time:time,place:''}}
  return {

function checkForm(pts,lineup){
  var faults=[],bad={};
  function add(t){faults.push(t);for(var i=1;i<arguments.length;i++)bad[arguments[i]]=true}
  [[4,5],[3,6],[2,1]].forEach(function(p){if(pts[p[0]][1]>=pts[p[1]][1])add('โซน '+p[0]+' (แนวหน้า) ยืนลึกกว่าโซน '+p[1]+' (แนวหลัง)',p[0],p[1])});
  [[4,3],[3,2],[5,6],[6,1]].forEach(function(p){if(pts[p[0]][0]>=pts[p[1]][0])add('โซน '+p[0]+' ต้องอยู่ซ้ายของโซน '+p[1],p[0],p[1])});
  [2,3,4].forEach(function(z){if(lineup[z]&&isLibero(lineup[z]))add('ลิเบอโรอยู่แนวหน้า (โซน '+z+')',z)});
  return {faults:faults,bad:bad};
}
function liberoOnCourt(){return ZONES.some(function(z){return S.lineup[z]&&isLibero(S.lineup[z])})}
function cleanLib(){if(!liberoOnCourt())S.libFor=null}
function onCourtIds(){var m={};ZONES.forEach(function(z){if(S.lineup[z])m[S.lineup[z]]=true});return m}
function clickZone(z){
  if(!can('lineup'))return;
  var sel=UI.courtSel;UI.note='';
  if(sel&&sel.k==='b'){S.lineup[z]=sel.id;UI.courtSel=null;cleanLib()}
  else if(sel&&sel.k==='z'){
    if(sel.z===z){UI.courtSel=null;return}
    var t=S.lineup[z];S.lineup[z]=S.lineup[sel.z];S.lineup[sel.z]=t;UI.courtSel=null}
  else if(S.lineup[z]){UI.courtSel={k:'z',z:z}}
}
function clickBench(id){
  if(!can('lineup'))return;
  var sel=UI.courtSel;UI.note='';
  if(sel&&sel.k==='z'){S.lineup[sel.z]=id;UI.courtSel=null;cleanLib()}
  else if(sel&&sel.k==='b'&&sel.id===id){UI.courtSel=null}
  else UI.courtSel={k:'b',id:id};
}
function rotate(dir){
  if(!can('lineup'))return;
  var map=dir>0?NEXT:PREV,nl={};
  ZONES.forEach(function(z){nl[map[z]]=S.lineup[z]});
  UI.note='';
  if(S.libFor&&nl[4]&&isLibero(nl[4])){nl[4]=S.libFor;S.libFor=null;UI.note='ลิเบอโรหมุนถึงแนวหน้า จึงให้ผู้เล่นมิดเดิลกลับเข้าแทนอัตโนมัติ'}
  S.lineup=nl;S.rot=((S.rot-1+(dir>0?1:5))%6)+1;UI.courtSel=null;
}
function toggleLibero(){
  if(!can('lineup'))return;
  UI.courtSel=null;UI.note='';
  var lineup=S.lineup;
  if(S.libFor){
    var z=ZONES.filter(function(k){return lineup[k]&&isLibero(lineup[k])})[0];
    if(z)lineup[z]=S.libFor;S.libFor=null;return}
  var zz=[5,6,1].filter(function(k){var p=byId(lineup[k]);return p&&p.pos==='MB'})[0];
  var lib=S.players.filter(function(p){return p.pos==='L'&&p.st==='active'&&!onCourtIds()[p.id]})[0];

  S.libFor=lineup[zz];lineup[zz]=lib.id;

  '<section class="card" aria-label="ตารางซ้อมสัปดาห์นี้" style="gap:12px"><h2>ตารางซ้อมสัปดาห์นี้ · '+range+'</h2><div class="wk">'+wkH+'</div><p class="muted">เลือกวันซ้อมเพื่อเช็คชื่อของวันนั้น</p></section>'+

  '<div class="chips" style="align-items:center" aria-live="polite"><span class="pill" style="background:#4ADE80;padding:6px 14px">มา '+cnt.p+'</span><span class="pill" style="background:#FFD23F;padding:6px 14px">สาย '+cnt.l+'</span><span class="pill" style="background:#FF6B6B;padding:6px 14px">ขาด '+cnt.a+'</span><span class="pill" style="background:#7DD3FC;padding:6px 14px">ลา '+cnt.e+'</span><span style="font-size:14px;color:var(--muted)">เช็คแล้ว '+checked+' / '+total+' · เข้าซ้อม '+(checked?Math.round((cnt.p+cnt.l)/checked*100)+'%':'—')+'</span></div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+plH+'</div></section>'+
  '<section class="card" aria-label="แผนแบบฝึกซ้อม" style="flex:1 1 320px;max-width:460px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>แบบฝึกประจำวัน</h2><span style="font-size:14px;color:var(--muted)">รวม '+S.drills.reduce(function(t,d){return t+d.min},0)+' นาที</span></div>'+
  '<ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px">'+dr+'</ol>'+
  (ed?'<div style="display:flex;flex-direction:column;gap:10px"><label class="fld" for="dr-name">ชื่อแบบฝึก<input class="txt" id="dr-name" type="text" data-in="drillName" placeholder="เช่น ฝึกรับลูกเสิร์ฟ" value="'+esc(UI.drillName)+'"></label><label class="fld" for="dr-min">เวลา (นาที)<input class="txt" id="dr-min" type="number" min="1" data-in="drillMin" value="'+esc(UI.drillMin)+'"></label><button class="btn main" data-act="addDrill">เพิ่มแบบฝึก</button></div>':'<p class="muted">บทบาทนี้ดูแผนแบบฝึกได้อย่างเดียว</p>')+'</section></div>';
}

function vRoles(){
  function full(x){return '<span class="perm full">แก้ไขได้</span>'}
  var V='<span class="perm view">ดูได้</span>',F=full(),N='<span class="perm none">ไม่มีสิทธิ์</span>';
  var rows=[['จัดตัวจริงและแท็กติกบนกระดานสนาม',F,V,'<span class="perm view">ดูตำแหน่งตัวเอง</span>'],['ข้อมูลและรายชื่อผู้เล่น',F,V,N],['บันทึกสถิติระหว่างและหลังเกม',F,F,N],['จัดตารางซ้อมและแบบฝึก',F,F,V],['ตารางแข่งขัน',F,V,V]];
  return head('สิทธิ์ผู้ใช้งาน','แต่ละบทบาทเห็นและแก้ไขข้อมูลได้ต่างกัน')+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px">'+
  '<section class="card" style="background:#fff;color:var(--ink);gap:8px;padding:20px"><h2 style="font-size:22px">Head Coach / Manager</h2><p style="margin:0;line-height:1.55">สิทธิ์สูงสุด จัดตัวจริง แก้ไขแท็กติก และจัดการข้อมูลทั้งหมดของทีม</p></section>'+
  '<section class="card" style="gap:8px;padding:20px"><h2 style="font-size:22px">Assistant Coach / Staff</h2><p style="margin:0;line-height:1.55;color:var(--muted)">ช่วยดูข้อมูล บันทึกสถิติ และจัดตารางซ้อม</p></section>'+
  '<section class="card" style="gap:8px;padding:20px"><h2 style="font-size:22px">Players</h2><p style="margin:0;line-height:1.55;color:var(--muted)">ดูตารางซ้อม ตารางแข่ง และเช็กตำแหน่งของตัวเอง</p></section></div>'+
  '<section class="card scroll" aria-label="ตารางเปรียบเทียบสิทธิ์" style="padding:8px 18px 14px"><table style="min-width:640px"><thead><tr><th scope="col">ความสามารถ</th><th scope="col">Head Coach</th><th scope="col">Assistant Coach</th><th scope="col">Player</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><th scope="row" style="font-weight:500;color:#fff;font-size:15px;padding:12px">'+r[0]+'</th><td style="padding:12px">'+r[1]+'</td><td style="padding:12px">'+r[2]+'</td><td style="padding:12px">'+r[3]+'</td></tr>'}).join('')+'</tbody></table></section>'+
  '<p class="muted" style="font-size:14px">ลองสลับบทบาทได้ที่เมนูด้านข้าง (ช่อง “บทบาท”) แล้วดูว่าปุ่มในแต่ละหน้าเปลี่ยนไปอย่างไร</p>';
}

/* ---------- shell ---------- */
var TITLES={court:'กระดานสนาม',roster:'ผู้เล่น',matches:'แมตช์',training:'ฝึกซ้อม',roles:'สิทธิ์ผู้ใช้'};
function route(){var h=(location.hash||'').replace('#','');return TITLES[h]?h:'court'}
var lastRoute=null;
function render(){
  var r=route(),fk=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-fk');
  var view={court:vCourt,roster:vRoster,matches:vMatches,training:vTraining,roles:vRoles}[r]();
  document.getElementById('main').innerHTML=view;
  document.getElementById('menu').innerHTML=NAV.map(function(n){return '<a class="nav" href="#'+n[0]+'"'+(n[0]===r?' aria-current="page"':'')+'>'+ico(n[2])+n[1]+'</a>'}).join('');
  var ro=ROLES[role()];
  document.getElementById('who').innerHTML='<div class="who-row"><div class="avatar" aria-hidden="true">'+ro.s+'</div><div style="line-height:1.3"><b style="font-weight:600">'+ro.l+'</b><small>'+ro.note+'</small></div></div><label for="role-sel" class="sr-or">บทบาท</label><select id="role-sel" data-in="role">'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'"'+(k===role()?' selected':'')+'>'+ROLES[k].l+'</option>'}).join('')+'</select>';
  document.title='VolleyBoard · '+TITLES[r];
  if(lastRoute!==r){lastRoute=r;var m=document.getElementById('main');if(m&&document.readyState==='complete'&&window.__navd){m.focus({preventScroll:true});window.scrollTo(0,0)}}
  if(fk){var el=document.querySelector('[data-fk="'+fk+'"]');if(el&&!el.disabled)el.focus({preventScroll:true})}
}
window.addEventListener('hashchange',function(){window.__navd=true;render()});

/* ---------- actions ---------- */
var A={
  dlgCancel:function(){closeDlg()},
  zone:function(d){clickZone(+d.z)},bench:function(d){clickBench(d.id)},
  removeSel:function(){if(!can('lineup')||!UI.courtSel||UI.courtSel.k!=='z')return;S.lineup[UI.courtSel.z]=null;UI.courtSel=null;cleanLib()},
  form:function(d){S.formation=d.k},
  rot:function(d){rotate(+d.d)},lib:function(){toggleLibero()},
  saveTpl:function(){if(!can('lineup'))return;if(S.templates.length>=4){UI.note='เก็บเทมเพลตได้สูงสุด 4 แบบ ลบทั้งหมดก่อนบันทึกใหม่';return}
    S.templates.push({label:FORMS[S.formation].label+' · R'+S.rot,lineup:Object.assign({},S.lineup),formation:S.formation,rot:S.rot,libFor:S.libFor});UI.note='บันทึกเทมเพลตแล้ว'},
  loadTpl:function(d){var t=S.templates[+d.i];if(!t||!can('lineup'))return;S.lineup=Object.assign({},t.lineup);S.formation=t.formation;S.rot=t.rot;S.libFor=t.libFor||null;UI.courtSel=null;UI.note='';cleanLib()},
  clearTpl:function(){S.templates=[]},
  filter:function(d){UI.filter=d.k},pick:function(d){UI.sel=d.id},
  status:function(d){var p=byId(UI.sel);if(p&&can('roster'))p.st=d.k},
  addP:function(){openDlg({title:'เพิ่มผู้เล่น',ok:'เพิ่มผู้เล่น',body:playerForm(),onSubmit:function(fd){var r=readPlayer(fd,null);if(typeof r==='string')return r;
    r.id='p'+Date.now();r.st='active';S.players.push(r);UI.sel=r.id}})},
  editP:function(d){var p=byId(d.id);if(!p)return;openDlg({title:'แก้ไข '+p.nick,ok:'บันทึก',body:playerForm(p),onSubmit:function(fd){var r=readPlayer(fd,p.id);if(typeof r==='string')return r;Object.assign(p,r)}})},
  delP:function(d){var p=byId(d.id);if(!p)return;openDlg({title:'ลบผู้เล่น',ok:'ลบ',body:'<p style="margin:0">ลบ #'+p.n+' '+esc(p.nick)+' ออกจากทีม ข้อมูลของผู้เล่นคนนี้จะหายไป</p>',onSubmit:function(){
    S.players=S.players.filter(function(x){return x.id!==p.id});ZONES.forEach(function(z){if(S.lineup[z]===p.id)S.lineup[z]=null});if(S.libFor===p.id)S.libFor=null;cleanLib();delete S.stats[p.id];if(UI.sel===p.id)UI.sel=null}})},
  selDate:function(d){UI.selDate=d.d},
  calPrev:function(){UI.calM--;if(UI.calM<0){UI.calM=11;UI.calY--}},calNext:function(){UI.calM++;if(UI.calM>11){UI.calM=0;UI.calY++}},
  addEv:function(){openDlg({title:'เพิ่มแมตช์',ok:'เพิ่มแมตช์',body:evForm(UI.selDate),onSubmit:function(fd){
    if(!String(fd.title||'').trim())return 'กรอกชื่อแมตช์';if(!fd.date)return 'เลือกวันที่แข่ง';
    S.events.push({id:'e'+Date.now(),type:fd.type,title:fd.title.trim(),date:fd.date,time:fd.time||'00:00',place:(fd.place||'').trim()});
    UI.selDate=fd.date;var dd=parseIso(fd.date);UI.calY=dd.getFullYear();UI.calM=dd.getMonth()}})},
  delEv:function(d){S.events=S.events.filter(function(e){return e.id!==d.id})},
  pt:function(d){if(!can('stats'))return;var L=S.live;if(d.w==='a')L.a++;else L.b++;L.hist.push(d.w)},
  undo:function(){var L=S.live,w=L.hist.pop();if(!w)return;if(w==='a')L.a--;else L.b--},
  to:function(){var L=S.live;if(L.to>0){L.to--;L.log.push('ขอเวลานอก ที่ '+L.a+'–'+L.b)}},
  sub:function(){var L=S.live;if(L.sub>0){L.sub--;L.log.push('เปลี่ยนตัว ที่ '+L.a+'–'+L.b)}},
  endSet:function(){var L=S.live;if(!L.a&&!L.b)return;L.sets.push({a:L.a,b:L.b});L.set++;L.a=0;L.b=0;L.to=2;L.sub=6;L.hist=[];L.log=[]},
  resetMatch:function(){openDlg({title:'เริ่มแมตช์ใหม่',ok:'ล้างและเริ่มใหม่',body:'<p style="margin:0">ล้างคะแนน เซ็ต และสถิติรายบุคคลของแมตช์ที่บันทึกอยู่</p>',onSubmit:function(){S.live={a:0,b:0,set:1,to:2,sub:6,hist:[],sets:[],log:[]};S.stats={}}})},
  trainDay:function(d){UI.trainDay=d.d},
  allPresent:function(){var a={};S.players.forEach(function(p){a[p.id]='p'});S.att[UI.trainDay]=a},
  delDrill:function(d){S.drills.splice(+d.i,1)},
  addDrill:function(){var m=parseInt(UI.drillMin,10);if(!UI.drillName.trim()||!(m>0))return;S.drills.push({name:UI.drillName.trim(),min:m});UI.drillName=''}
};
var MUT_NO_RENDER={plan:1,stat:1,drillName:1,drillMin:1};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=A[b.getAttribute('data-act')];if(!f)return;
  var d={};for(var i=0;i<b.attributes.length;i++){var a=b.attributes[i];if(a.name.indexOf('data-')===0)d[a.name.slice(5)]=a.value}
  var isDlg=!!b.closest('dialog');
  f(d);
  if(!dlg.open||b.getAttribute('data-act')==='dlgCancel'){save();render()}
});
function onInput(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-in');if(!k)return;
  if(k==='role'){if(e.type!=='change')return;S.role=t.value;UI.courtSel=null;save();render();var s=document.getElementById('role-sel');if(s)s.focus();return}
  if(k==='plan'){var p=S.plans[UI.selDate]=S.plans[UI.selDate]||{};p[t.getAttribute('data-k')]=t.value;save();return}
  if(k==='stat'){var id=t.getAttribute('data-id');(S.stats[id]=S.stats[id]||{})[t.getAttribute('data-k')]=t.value;save();return}
  if(k==='drillName'){UI.drillName=t.value;return}
  if(k==='drillMin'){UI.drillMin=t.value;return}
  if(k==='att'&&e.type==='change'&&can('training')){var a=S.att[UI.trainDay]=S.att[UI.trainDay]||{};a[t.getAttribute('data-id')]=t.getAttribute('data-v');save();render()}
}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='dr-name'){e.preventDefault();A.addDrill();save();render();var n=document.getElementById('dr-name');if(n)n.focus()}});
render();
})();
</script>
