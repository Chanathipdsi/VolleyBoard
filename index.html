<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolleyBoard</title>
<meta name="description" content="VolleyBoard — ระบบจัดการทีมวอลเลย์บอล / Volleyball team management">
<meta name="theme-color" content="#2128D0">
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script>
// Apply saved appearance before first paint (no flash).
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('vb-prefs') || '{}'), d = document.documentElement;
    var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
    d.dataset.resolved = dark ? 'dark' : 'light';
    if (p.accent) d.dataset.accent = p.accent;
    if (p.size) d.dataset.size = p.size;
    if (p.contrast) d.dataset.contrast = '1';
    if (p.compact) d.dataset.compact = '1';
    if (p.reduceMotion) d.dataset.motion = 'off';
    if (p.lang) d.lang = p.lang;
  } catch (e) { document.documentElement.dataset.resolved = 'dark'; }
})();
</script>
</head>
<body>
<div id="root"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">VolleyBoard ต้องเปิดใช้งาน JavaScript / requires JavaScript.</p></noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
